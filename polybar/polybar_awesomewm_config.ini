[bar/main]
width = 100%
height = 28
offset-x = 0
offset-y = 0
modules-left = xworkspaces
modules-center = date
modules-right = custom/volume xkeyboard
background = #000000
foreground = #ffffff
border-size = 2
border-color = #393869
font-0 = "JetBrains Mono:size=11;2"
font-1 = "Symbols Nerd Font Mono:size=13;2"
override-redirect = true
wm-restack = generic
cursor-click = pointer
monitor = ${env:MONITOR:}
monitor-strict = false

[colors]
background = #000000
background-alt = #1a1a1a
foreground = #ffffff
foreground-alt = #ffffff
primary = #000000
secondary = #000000
alert = #ff0000
disabled = #555555

[module/xworkspaces]
type = internal/xworkspaces
format = <label-state>
icon-0 = 1;
icon-1 = 2;
icon-2 = 3;
icon-3 = 4;
icon-4 = 5;
icon-5 = 6;
icon-6 = 7;
icon-7 = 8;
icon-8 = 9;
icon-default = 󰊠
label-active = %icon%
label-active-foreground = #fff8cb
label-active-background = #000000
label-active-padding = 2
label-occupied = %icon%
label-occupied-foreground = #00ff00
label-occupied-background = #000000
label-occupied-padding = 2
label-urgent = %icon%
label-urgent-foreground = #ff5555
label-urgent-background = #000000
label-urgent-padding = 2
label-empty = %icon%
label-empty-foreground = #D92639
label-empty-background = #000000
label-empty-padding = 2
label-separator = |
label-separator-foreground = #ffffff

[module/date]
type = internal/date
interval = 1.0
date = %a, %d %b %Y
time = %H:%M:%S
format = <label>
label = %date% %time%
label-foreground = #ffffff
label-background = #000000
label-padding = 2

[module/xkeyboard]
type = internal/xkeyboard
format = <label-layout>
label-layout = "%icon% %name%"
label-layout-padding = 2
label-layout-background = #000000
label-layout-foreground = #ffffff
layout-icon-0 = us;
layout-icon-1 = ru;󰡔

[module/custom/volume]
type = custom/script
exec = echo ""
interval = 86400
click-left = pavucontrol &
scroll-up = pactl set-sink-volume @DEFAULT_SINK@ +5%
scroll-down = pactl set-sink-volume @DEFAULT_SINK@ -5%
click-middle = pactl set-sink-mute @DEFAULT_SINK@ toggle
format = <label>
label = %output%
label-foreground = #ffffff
label-background = #000000
label-padding = 2
