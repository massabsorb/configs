# Kitty terminal configuration
# Version: 0.46.2
# Font: Fira Code Retina, size 12
# Colors: soft white text, very dark gray background (slightly lighter than black)

# Font settings
font_family      Fira Code Retina
font_size        12.0
disable_ligatures never

# Colors
foreground       #F0F0F0   # Soft white text
background       #111111   # Very dark gray, just a bit lighter than black
selection_background #333333

# Cursor settings
cursor_shape     beam
cursor_color     #32CD32   # Зелёный цвет курсора (lime green)

# Background opacity
background_opacity 1.0

# UI
hide_window_decorations no
window_padding_width 5
dynamic_padding yes

# Mouse and selection
copy_on_select yes                # Выделение мышью автоматически копирует в буфер обмена
mouse_hide_wait 2.0
url_color #4A9EFF
url_style curly

# Scrollback
scrollback_lines 5000
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS
scrollback_pager_history_size 0

enable_audio_bell no


# Performance
sync_to_monitor yes
repaint_delay 10
input_delay 3

# ========== Копирование и вставка ==========
map ctrl+c copy_or_interrupt
map ctrl+v paste_from_clipboard
mouse_map middle click paste_from_clipboard
